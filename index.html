<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toys</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='11' cy='11' r='5' fill='%238ea2ff'/><circle cx='23' cy='11' r='5' fill='%236ee7a8'/><circle cx='11' cy='23' r='5' fill='%236ee7a8'/><circle cx='23' cy='23' r='5' fill='%238ea2ff'/></svg>">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --line: #262c3a;
    --ink: #e8ecf5;
    --dim: #7c8598;
    --accent: #8ea2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 8vh 24px 12vh;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); margin: 0 0 40px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  a.toy {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, transform .15s;
  }
  a.toy:hover { border-color: var(--accent); transform: translateY(-2px); }
  .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name { font-size: 19px; font-weight: 600; }
  .shape { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .what { color: var(--dim); margin: 6px 0 0; }
  footer { color: var(--dim); font-size: 13px; margin-top: 48px; }
</style>
</head>
<body>
<main>
  <h1>Toys</h1>
  <p class="sub">Things built for no reason. Click one.</p>

  <ul id="list"></ul>

  <footer>Everything here runs in your browser. Nothing is saved, nothing is sent anywhere.</footer>
</main>

<script>
/* Add a toy: drop its folder in beside this file, add one line here. */
const TOYS = [
  {
    path: 'spirograph/',
    name: 'Sentence Spirograph',
    shape: 'instrument',
    what: 'Type a sentence. Each letter steers a pen, and the sentence draws itself as one unbroken line.',
  },
  {
    path: 'tiny-doors/',
    name: 'Cabinet of Tiny Doors',
    shape: 'toy',
    what: 'A wall of numbered doors. Open one, find something small and unreasonable. The numbers reshuffle while you are not looking.',
  },
  {
    path: 'meeple-curling/',
    name: 'Meeple Curling',
    shape: 'toy',
    what: 'Drag to flick a wooden meeple down the felt. Free play, or three set scenarios: extra end, buried button, corner freeze.',
  },
  {
    path: 'ceiling-machine/',
    name: 'The Ceiling Machine',
    shape: 'generator',
    what: 'Type a task. Receive a municipal ordinance forbidding you from doing too much of it, with an enforcing agency, a penalty for exceeding, and a stamp.',
  },
  {
    path: 'sticker-sheet/',
    name: 'Sticker Sheet',
    shape: 'toy',
    what: 'An endless vinyl sticker sheet, themed — animals, space, food, games. Drag a corner, the backing curls and crackles, and it comes free. Peeled ones stick to the glass. Refresh for a new sheet.',
  },
  {
    path: 'box-stack/',
    name: 'Box Stack',
    shape: 'toy',
    what: 'Drag board game boxes off the shelf and stack them. Real weight, real friction, real contact points. They lean, they wobble, and eventually the whole tower goes.',
  },
];

document.getElementById('list').innerHTML = TOYS.map(t => `
  <li><a class="toy" href="${t.path}">
    <div class="row"><span class="name">${t.name}</span><span class="shape">${t.shape}</span></div>
    <p class="what">${t.what}</p>
  </a></li>
`).join('');
</script>
</body>
</html>
